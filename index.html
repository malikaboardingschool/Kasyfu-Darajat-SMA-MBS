            line-height: 1.2;
        }
        
        /* Strict A4 Setup for Screen & Print */
        .a4-page {
            width: 210mm;
            height: 297mm; /* Strictly 1 page per container */
            padding: 15mm 15mm; /* Margin dikembalikan ke ukuran proporsional karena bingkai sudah dihapus */

            overflow: hidden;

                margin: 0 !important;

                height: 100% !important;
                margin: 0 !important;

        function numberToArabicWords(num) {
            num = parseInt(num);
            if (isNaN(num)) return "-";
            if (num === 100) return "مائة";
            if (num === 0) return "صفر";
            
            const ones = ["", "واحد", "اثنان", "ثلاثة", "أربعة", "خمسة", "ستة", "سبعة", "ثمانية", "تسعة"];
            const tens = ["", "عشرة", "عشرون", "ثلاثون", "أربعون", "خمسون", "ستون", "سبعون", "ثمانون", "تسعون"];
            
            if (num < 10) return ones[num];
            if (num === 10) return "عشرة";
            if (num < 20) {
                const o = num % 10;
                if (o === 1) return "أحد عشر";
                if (o === 2) return "اثنا عشر";
                return ones[o] + " عشر";
            }
            
            const o = num % 10;
            const t = Math.floor(num / 10);
            
            if (o === 0) return tens[t];
            return ones[o] + " و" + tens[t];
        }

        function toArabicDigits(str) {
            if (str === undefined || str === null) return "";
            const idMap = {
                '0': '٠', '1': '١', '2': '٢', '3': '٣', '4': '٤',
                '5': '٥', '6': '٦', '7': '٧', '8': '٨', '9': '٩'
            };
            return str.toString().replace(/[0-9]/g, function (w) {
                return idMap[w];
            });
        }

        function App() {

                mahadName: "معهد التربية الإسلامية ماليك",
                className: "العاشر الألف", 
                semester: "الثاني", 
                academicYear: "٢٠٢٥ - ٢٠٢٦ مـ",
                homeroomTeacher: "كياهي الحاج أحمد بيهقي",
                homeroomTeacherNip: "", 
                headmaster: "الأستاذ الحاج شهراني",
                headmasterNip: "", 
                placeDateGreg: "تنجرانج، ١٩ يونيو ٢٠٢٦ مـ",
                placeDateHijr: "٤ محرم ١٤٤٨ هـ",
                useEasternArabicDigits: true
            });

            const [students, setStudents] = useState(DEFAULT_STUDENTS);
            const [selectedStudentId, setSelectedStudentId] = useState("1");
            const [editingStudent, setEditingStudent] = useState(null);
            const [isConfigOpen, setIsConfigOpen] = useState(false);
            const [toast, setToast] = useState({ show: false, message: "", type: "success" });

            const currentStudent = students.find(s => s.id === selectedStudentId) || students[0] || null;

            const triggerToast = (message, type = "success") => {
                setToast({ show: true, message, type });
                setTimeout(() => {
                    setToast(prev => ({ ...prev, show: false }));
                }, 4000);
            };

            const formatNum = (val) => {
                if (val === undefined || val === null) return "";
                return schoolConfig.useEasternArabicDigits ? toArabicDigits(val.toString()) : val.toString();
            };

            const calculateStats = (student) => {
                if (!student) return { total: 0, average: 0 };
                const grades = Object.values(student.grades);
                const total = grades.reduce((sum, g) => sum + Number(g || 0), 0);
                const average = grades.length > 0 ? (total / grades.length).toFixed(1) : 0;
                return { total, average };
            };

            const downloadExcelTemplate = () => {
                const headers = ["NISN (Nomor Induk)", "Nama Siswa (Latin)", "Nama Siswa (Arab)"];
                ALL_SUBJECT_FIELDS.forEach(sub => headers.push(`${sub.nameId} (${sub.id})`));
                headers.push("Sakit", "Izin", "Alpa", "Suluk (Kelakuan)", "Nazhafah (Kebersihan)", "Muraqabah (Kedisiplinan)");

                const data = [
                    headers,
                    [
                        "006602015", "Athariz Chalief Saputra", "أتاريز خليف سابوترا",
                        ...ALL_SUBJECT_FIELDS.map(() => 80),
                        1, 2, 0, "جيد جدا", "جيد جدا", "جيد جدا"
                    ],
                ];

                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template Rapor SMA");
                XLSX.writeFile(wb, `Template_Rapor_SMA.xlsx`);
                triggerToast("Template Excel berhasil diunduh!", "success");
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                        if (jsonData.length < 2) {
                            triggerToast("Berkas Excel kosong!", "error"); return;
                        }

                        const newStudents = [];
                        for (let i = 1; i < jsonData.length; i++) {
                            const row = jsonData[i];
                            if (!row || !row[1]) continue;

                            const grades = {};
                            let colIdx = 3;
                            ALL_SUBJECT_FIELDS.forEach(sub => {
                                grades[sub.id] = Number(row[colIdx] !== undefined ? row[colIdx] : 80);
                                colIdx++;
                            });

                            newStudents.push({
                                id: String(Date.now() + i),
                                nisn: String(row[0] || ""),
                                nameLatin: String(row[1] || ""),
                                nameArab: String(row[2] || ""),
                                grades,
                                attendance: { sakit: Number(row[colIdx]||0), izin: Number(row[colIdx+1]||0), alpa: Number(row[colIdx+2]||0) },
                                behavior: { suluk: String(row[colIdx+3]||"جيد جدا"), nazhafah: String(row[colIdx+4]||"جيد جدا"), muraqabah: String(row[colIdx+5]||"جيد جدا") }
                            });
                        }

                        if (newStudents.length > 0) {
                            setStudents(newStudents);
                            setSelectedStudentId(newStudents[0].id);
                            triggerToast(`Berhasil mengimpor ${newStudents.length} siswa!`, "success");
                        }
                    } catch (err) { triggerToast("Gagal memproses file Excel.", "error"); }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = null;
            };

            const saveStudentManualEdit = (e) => {
                e.preventDefault();
                setStudents(students.map(s => s.id === editingStudent.id ? editingStudent : s));
                setEditingStudent(null);
                triggerToast("Perubahan berhasil disimpan!", "success");
            };

            const triggerPrint = () => window.print();

            const downloadPDF = () => {
                if (!currentStudent) return;
                
                triggerToast("Sedang menyiapkan dokumen PDF...", "success");
                
                const element = document.getElementById('pdf-content');
                // Simpan class asli container parent agar bisa dikembalikan (mengatasi bug html2canvas terpotong scroll)
                const scrollContainer = element.parentElement;
                const originalClasses = scrollContainer.className;
                
                // Buang class pembatas tinggi sementara waktu untuk merender full canvas
                scrollContainer.className = "lg:col-span-8 flex flex-col items-center print-container p-0";
                
                // Tambahkan kelas mode pdf
                element.classList.add('pdf-mode');
                document.body.classList.add('rendering-pdf');

                const safeName = currentStudent.nameLatin.replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const semesterClean = schoolConfig.semester.split('/')[0].trim();
                const fileName = `Rapor_${safeName}_${semesterClean}.pdf`;

                const opt = {
                    margin:       0,
                    filename:     fileName,
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { 
                        scale: 2, 
                        useCORS: true, 
                        scrollY: 0,
                        scrollX: 0,
                        windowWidth: document.documentElement.offsetWidth
                    },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                // Generate PDF
                html2pdf().set(opt).from(element).save().then(() => {
                    element.classList.remove('pdf-mode');
                    document.body.classList.remove('rendering-pdf');
                    scrollContainer.className = originalClasses; // Kembalikan tampilan UI ke bentuk semula
                    triggerToast("PDF berhasil diunduh!", "success");

                    element.classList.remove('pdf-mode');
                    document.body.classList.remove('rendering-pdf');
                    scrollContainer.className = originalClasses; // Kembalikan tampilan UI ke bentuk semula

                    console.error(err);
                });
            };

                                <span class="font-semibold">{schoolConfig.academicYear}</span>
                            </div>
                        </div>
                        <div class="text-left w-1/3 font-sans" dir="ltr">
                            <div class="font-bold text-[11px] text-slate-800 uppercase tracking-wider leading-tight print:text-[9.5px]">Laporan Hasil Belajar (Rapor)</div>

                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>

                                        <div class="pt-4 border-t border-slate-100">
                                            <h4 class="font-bold text-sm text-slate-800 mb-3 pb-1 border-b border-slate-200 flex items-center gap-1.5"><i class="fa-solid fa-graduation-cap text-blue-600"></i> Pelajaran Umum (المواد العامة)</h4>

                                                {SUBJECTS_UMUM.map(sub => (

                                                        <div class="flex items-center gap-2">
                                                            <span class="text-xs text-slate-400 arabic-text">{sub.nameAr}</span>
                                                            <input type="number" min="0" max="100" value={editingStudent.grades[sub.id]} onChange={(e) => { const gr = {...editingStudent.grades}; gr[sub.id] = Number(e.target.value); setEditingStudent({...editingStudent, grades: gr}); }} class="w-16 border border-slate-300 rounded p-1 text-center font-semibold"/>

                                            <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold shadow-md transition">Simpan</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
